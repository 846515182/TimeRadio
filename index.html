<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0718" />
  <title>时光电台</title>
  <meta name="description" content="时光电台 · 拾起耳朵里的好时光" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="时光电台" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <main class="app">
    <!-- v1.20.8：台标回左上角角标，徽章（开播中/在线/曲库）全撤。
         用户原话「把曲库删掉 在线人数也删掉 开播中也删掉 那个头像位置改在左上角」。
         电台该有的样子：一个角标 + 一首歌 + 排队的人，别堆仪表盘。 -->
    <header class="top">
      <div class="brand">
        <img class="brand-avatar" src="icons/dj-avatar.png" alt="时光电台" />
        <span class="brand-logo">时光电台</span>
      </div>
      <p class="slogan">拾起耳朵里的好时光 · MUSIC RADIO</p>
      <!-- v1.25：徽章就一行「在线 N」（用户原话「就写个在线 然后数量不好吗
           一行就好了」）。默认 235；presence 感知到真实在线听友就在此之上
           实时累加（235 + n），线路不可用也保持 235 —— 绝不显示 0/空。 -->
      <div class="online-pill" id="hdrOnline" title="在线人数（默认235，真实在线往上加）">
        <span class="online-dot" aria-hidden="true"></span><span>在线 <span id="hdrOnlineN">235</span></span>
      </div>
    </header>

    <section class="player" aria-label="播放器">
      <!-- v1.21.31 中间重排（用户原话「中间那个大头像怎么还在 太丑了」「中间改成一条波浪线 滚动歌曲列表放波浪正下方」）：
           ① 左边那条排队栏（queueRail 容器 + 波浪条 + 第二条渐变）整块删除
              —— 全站只剩一条波浪；
           ② 中间大头像（黑胶盘 .cover-ring / 音符 .note / 均衡器 .eq）一并撤掉，
              原位置改成**一条通栏横向霓虹波浪**（#cover 现在是波浪条，不是圆盘）；
           ③ 排队字幕轨搬到**波浪正下方**的 .stage-tick，id 全部沿用
              queueRail / railTick / railTickTrack / queueRailEmpty ——
              app.js 的 renderUpNext 一字未改。 -->

      <div class="stage">
        <div class="cover" id="cover">
          <!-- v1.21.31：大头像整块撤掉，这里不再是「圆盘封面」，而是一条
               通栏的横向波浪条。#cover 的形态（全宽 / 18px 圆角 /
               overflow:visible 让辉光外溢）收口在 style.css 末尾
               「v1.21.31 中间大重排」那段覆盖。 -->
          <!-- v1.21.19：首页大头像换成音乐波形。主播照片撤掉 —— 电台该有的样子。
               v1.21.30：圆盘里那组柱状波形换成一条横向波浪线（后被 v1.21.35 撤掉）。
               v1.21.35：那条线连着被否两次（用户原话「太丑了」），换成
               **整首镜像柱波 + 播放头**（SoundCloud 同款做法：波形在服务端
               预计算好下发，客户端只负责渲染）。服务端 env_of 早把整首的响度
               曲线随 air 下发了，现在直接画成形状本身 —— 不再拿真数据去调
               一条正弦的振幅（数据真、形状假，这才是「看着假」的根子）。
               三根 path 各司其职：wave-rest = 还没播到（压暗）、
               wave-main = 播过的（点亮）、wave-head = 播放头。
               拉到频谱侧车（成片url+.spec）后 x 轴换成频段：main = 48 根
               底锚真频谱柱（无镜像）、rest = 峰值保持白点、播放头按 .wave.eq
               藏起（进度交给下面的进度条）；没拉到侧车就走老路。
               柱子靠 stroke-linecap:round 出圆头，一条 path 装下全部柱子，
               每帧只改一次 d —— 不用 canvas roundRect（Chrome 99+，这台跑不了），
               全程也不碰 AudioContext（接上会被 WebView 掐掉声音且回不去）。 -->
          <div class="wave" id="coverWave" aria-hidden="true">
            <svg class="wave-svg" viewBox="0 0 320 96" preserveAspectRatio="none">
              <defs>
                <!-- 频段彩虹：色相沿 x 从 240°（低频蓝）扫到 -60°（高频紫），
                     中经 青180/绿120/黄60/红0 —— 25 段 stop，hsv(0.88,1.0)
                     按 tools/wave_eq3.py 的 band_hue 同一公式算出来的。 -->
                <linearGradient id="wGradHero" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#1f1fff" />
                  <stop offset="4.167%" stop-color="#1f4dff" />
                  <stop offset="8.333%" stop-color="#1f7cff" />
                  <stop offset="12.5%" stop-color="#1fabff" />
                  <stop offset="16.67%" stop-color="#1fdaff" />
                  <stop offset="20.83%" stop-color="#1ffff6" />
                  <stop offset="25%" stop-color="#1fffc7" />
                  <stop offset="29.17%" stop-color="#1fff98" />
                  <stop offset="33.33%" stop-color="#1fff69" />
                  <stop offset="37.5%" stop-color="#1fff3b" />
                  <stop offset="41.67%" stop-color="#31ff1f" />
                  <stop offset="45.83%" stop-color="#60ff1f" />
                  <stop offset="50%" stop-color="#8fff1f" />
                  <stop offset="54.17%" stop-color="#beff1f" />
                  <stop offset="58.33%" stop-color="#ecff1f" />
                  <stop offset="62.5%" stop-color="#ffe31f" />
                  <stop offset="66.67%" stop-color="#ffb41f" />
                  <stop offset="70.83%" stop-color="#ff851f" />
                  <stop offset="75%" stop-color="#ff571f" />
                  <stop offset="79.17%" stop-color="#ff281f" />
                  <stop offset="83.33%" stop-color="#ff1f44" />
                  <stop offset="87.5%" stop-color="#ff1f73" />
                  <stop offset="91.67%" stop-color="#ff1fa1" />
                  <stop offset="95.83%" stop-color="#ff1fd0" />
                  <stop offset="100%" stop-color="#ff1fff" />
                </linearGradient>
              </defs>
              <line class="wave-base" x1="0" y1="92" x2="320" y2="92" />
              <path class="wave-rest" />
              <path class="wave-main" />
              <rect class="wave-head" x="320" y="12" width="1.8" height="72" />
              <circle class="wave-pen" cx="320" cy="48" r="3.4" />
            </svg>
          </div>
          <span class="status" id="status">正在接通直播…</span>
        </div>

        <!-- 排队字幕轨：紧跟波浪下沿，一条从右往左滚的字幕（序号 · 歌名 ·
             谁点的）。整节默认 hidden，没队列时 renderUpNext 会把它藏起来。 -->
        <div class="stage-tick" id="queueRail" hidden aria-label="排队">
          <div class="rail-tick" id="railTick">
            <div class="rail-tick-track" id="railTickTrack"></div>
          </div>
          <p class="queue-rail-empty" id="queueRailEmpty">还没人排队</p>
        </div>

        <h1 id="stationName">时光电台</h1>
        <p class="now-artist" id="nowArtist" hidden></p>
        <p class="desc" id="stationDesc">点一首歌，云端主播放给你听</p>
        <p class="now-title" id="nowTitle"></p>
        <div class="song-meta" id="songMeta" hidden></div>
      </div>

      <!-- v1.20：直播没有「暂停」—— 收音机拧开就一直听，所以不再有播放/暂停按钮。
           进度条现在表示「当前这首播到哪」，由服务端 air.startedAt 驱动（不可拖动）。 -->
      <div class="vod-row" id="vodRow" hidden>
        <span class="vod-time" id="vodCur">0:00</span>
        <span class="vod-track" id="vodTrack" role="slider" aria-label="播放进度" tabindex="0"><i id="vodPct"></i></span>
        <span class="vod-time" id="vodDur">--:--</span>
      </div>

      <!-- v1.21.30：音量从滑杆改成 **− / ＋ 两颗按钮**（用户原话「音量控制滑动
           很容易误碰 改成两个按钮加减音量」）。中间那截是**纯展示**（分段条 +
           数字），点不中就不会被误碰；每次 ±10%。滑杆那一整套 range 样式与
           input 事件监听一并删掉，音量值改由 app.js 的 volLevel 变量持有。 -->
      <section class="volume" aria-label="音量">
        <button class="vol-btn" id="volDown" type="button" aria-label="音量减小">−</button>
        <span class="vol-meter" id="volMeter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="vol-num" id="volNum" aria-live="polite">85</span>
        <button class="vol-btn" id="volUp" type="button" aria-label="音量增大">＋</button>
      </section>

      <button class="dj-bubble" id="djBubble" type="button" aria-label="打开在线点歌">
        <span class="dj-face" aria-hidden="true">🎙️</span>
        <span class="dj-text" id="djText">主播在线 · 想听什么就点</span>
        <span class="dj-cta">点歌</span>
      </button>

      <!-- 直播接入提示：正常情况下 App 一打开就连上流并出声，这条是隐藏的。
           只有自动播放被拦 / 断线待救时才露出来，点一下（重新）接上直播。 -->
      <button class="dj-bubble air-bar" id="airBar" type="button" hidden aria-label="接上直播">
        <span class="dj-face" aria-hidden="true">📻</span>
        <span class="dj-text" id="airText">正在开播</span>
        <span class="dj-cta">接上</span>
      </button>
    </section>

    <footer>
      时光电台 · 拾起耳朵里的好时光<br />
      <!-- v1.21.30：底部那颗「检查更新」按钮删掉（用户原话「更新应该是自动弹出，
           底部不用显示 检查更新」）。检查本身照常 —— 启动静默查一次 + 每 6 小时
           再查一次，发现新版本就直接弹那个「发现新版本」对话框（见 app.js）。
           版号留成纯文本：不点、不占一条按钮的热区，但排错时还看得见。 -->
      <span class="ver-plain" id="verLabel">v…</span>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="dialog-mask" id="updateMask" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="updTitle">
      <h3 id="updTitle">发现新版本 🎉</h3>
      <p class="dialog-ver" id="updVer"></p>
      <p class="dialog-body" id="updBody"></p>
      <div class="upd-progress" id="updProgress" hidden>
        <div class="upd-bar"><i id="updBar"></i></div>
        <p class="upd-pct" id="updPct">0%</p>
      </div>
      <div class="dialog-actions">
        <button class="ghost" id="updLater" type="button">暂不更新</button>
        <button class="primary" id="updGo" type="button">立即更新</button>
      </div>
    </div>
  </div>

  <div class="dialog-mask" id="reqMask" hidden>
    <div class="dialog req-dialog" role="dialog" aria-modal="true" aria-labelledby="reqTitle">
      <!-- 抓手：点歌台现在是贴底的抽屉（用户反馈「不要那个框」）。抓手能拖，
           配上下滑关闭手势，不用去找那个 ✕。 -->
      <div class="dialog-grip" id="reqGrip" aria-hidden="true"><i></i></div>
      <!-- 标题行：右边常驻一个 ✕。以前退出只能靠底部那个「收起」，而弹窗没有
           max-height 也不滚动，点几首歌后队列把弹窗撑出屏幕，那个按钮被顶到
           屏幕外 —— 用户反馈「点完后返回按钮都没有」，等于被困在点歌台里。 -->
      <!-- v1.21.12 头部重排：头一行交代「我是谁」，第二行「输入 + 点歌」同排。
           v1.25：「N 人一起点歌」协同读数整块删除（用户：这几个字没啥用，
           删除相关代码）—— 头部只剩标题；名字按钮直接显示当前名字（点开可改）。 -->
      <div class="dialog-head req-head">
        <div class="req-head-l">
          <h3 id="reqTitle">🎧 点歌台</h3>
        </div>
        <div class="req-head-r">
          <button class="nick-btn" id="nickBtn" type="button" title="改名字">名字</button>
          <button class="dialog-x" id="reqX" type="button" aria-label="收起点歌台">✕</button>
        </div>
      </div>
      <!-- v1.21.12：昵称编辑默认收起（点头部名字才展开）。v1.25 措辞改「你的
           名字」（用户：「改名字/昵称」感觉怪怪的）。 -->
      <div class="req-nick" id="reqNickBox" hidden>
        <label for="nickInput">你的名字</label>
        <input id="nickInput" type="text" maxlength="16" placeholder="别人点歌时看到的名字" />
      </div>
            <!-- v1.21.14：创作区收进一张卡（视觉主角），下面紧跟「我的歌」卡 ——
           打开点歌台第一眼要看到的是「我的歌还要多久轮到」，不是一堆表单。 -->
      <div class="compose-card">
      <form class="req-form req-compose" id="reqForm" autocomplete="off">
        <!-- 输入 + 点歌同一行：这是整个面板唯一的主按钮（省掉一整行的高度） -->
        <div class="req-compose-row">
          <div class="ac-wrap">
            <input id="reqInput" type="text" placeholder="想听哪首歌？主播全网找"
                   maxlength="30" enterkeyhint="search" />
          </div>
          <button class="primary req-go" id="reqGo" type="submit">点歌</button>
        </div>
        <!-- v1.24：搜索平台（QQ音乐默认，其余备选）。选中哪家这一单先搜哪家；
             输入框敲 /netease 歌名 这类指令也能逐单覆盖（用户原话「这是格式」）。
             云端按「选中→其余平台→YouTube」的序模拟人工点歌，四平台全空才报
             没找到 —— 点歌永远不会整队卡死。 -->
        <div class="req-src" id="reqSrc">
          <button type="button" class="src-chip on" data-src="qq">QQ音乐</button>
          <button type="button" class="src-chip" data-src="netease">网易云</button>
          <button type="button" class="src-chip" data-src="kugou">酷狗</button>
          <button type="button" class="src-chip" data-src="kuwo">酷我</button>
        </div>
        <!-- v1.21.30 整块删除（用户原话「点歌搜索下面那个框有啥用 里面显示歌曲
             感觉没啥用 删掉相关代码」，并确认「两个都删」）：
               ① 联想面板 #acPanel（打字就弹的歌曲列表 + 上一页/下一页/云端搜）；
               ② 曲库常听 #reqChips（横向一排速点歌）。
             一并删掉的还有它们的 JS（acLocalHits / renderAc / paintAcFoot / acGo /
             searchAsk / showAc / showLibrary / hideAc / renderChips / pickSong，
             以及只为它们服务的 catalog.json 拉取），和 CSS（.ac-* / .req-chips /
             .chip）。
             点歌的主路不受影响：**写歌名 → 点「点歌」→ 云端全网找**，
             找到就弹「挑个版本」。搜索服务端接口 op=q 保留（live-search 联测还在用）。 -->
        <!-- v1.21.30：主播性格选择器整块删除（用户原话「主播性格感觉也没啥用…
             这个不应该服务端默认的吗 用户app 可以选 有啥用」）。
             性格改回**纯服务端按时段默认**：server.py 的 dj_mood() 按 6-17 / 17-21 /
             21-6 自己切 announce/chat/night，客户端不再发 mood 字段。
             老设备上的 fm891.mood 台账键在启动时清掉（request.js）。 -->
      </form>
      </div>
      <!-- 我的歌：自己的 pending 单置顶，位次 + 预计时间 + 直接操作 -->
      <div class="my-card" id="reqMyCard" hidden></div>
      <p class="req-hint" id="reqHint"></p>
      <!-- v1.21.29 卡片化队列。v1.25：「全网 N 首在队 · 你的歌第 X 位」汇总行
           整行删除（用户：也没啥用）—— 位次只留在「我的歌」卡与队列行上。 -->
      <section class="sec queue-sec" id="reqQueue" hidden>
        <ul class="req-list" id="reqList"></ul>
      </section>
      <!-- v1.21.29：「我今天点过的」整条链路摘干净（用户原话「这个功能没啥用」，
           随后确认连行首 ✓ 徽章也一起摘）。删掉的是：HTML 折叠块、renderHist()、
           retryOwn()、本地台账 fm891.myhist（写入 histNote / 查询 histHas）、
           ✓ 徽章 DOM 与 .mine-tag 样式；老设备上的旧台账键也在启动时清掉。
           队列行剩下的高亮认的是**实时归属**（本机 cid），和台账无关。 -->
      <div class="dialog-actions">
        <button class="ghost" id="reqClose" type="button">收起</button>
      </div>
    </div>
  </div>

  <!-- 选版弹窗（v1.21.11「点歌流程弄成弹窗选择」）：候选版本不再铺在点歌台
       条目里，改弹窗挑。新候选一轮自动弹一次；行内的「选版本」把手随时重开；
       「取消点歌」= 中途撤单（del 墓碑 → 云端中止找歌/换版、必要时下架）。 -->
  <div class="dialog-mask" id="candMask" hidden>
    <div class="dialog cand-dialog" role="dialog" aria-modal="true" aria-labelledby="candTitle">
      <div class="dialog-head">
        <h3 id="candTitle">🎵 挑个版本</h3>
        <button class="dialog-x" id="candX" type="button" aria-label="关闭选版">✕</button>
      </div>
      <p class="req-cands-h" id="candHint">挑一个版本（不挑就用推荐那版）</p>
      <span class="req-cands-list" id="candList"></span>
      <div class="dialog-actions">
        <button class="req-cand-ok" id="candOk" type="button">确定</button>
        <!-- v1.21.15：版本不对就换一批（服务器重新搜更深的候选，去掉已给过的） -->
        <button class="cand-more" id="candMore" type="button">换一批版本</button>
        <button class="cand-later" id="candLater" type="button">稍后再说</button>
        <button class="cand-cancel" id="candCancel" type="button">取消点歌</button>
      </div>
    </div>
  </div>

  <audio id="audio" preload="none"></audio>
  <!-- v1.21.22：删掉了独立垫乐音轨（#bgm）。用户要的是「就用正在播的
       这首歌当背景、声音渐大渐小」，不是多播一份 dj-bed —— 两条音轨各播各的
       只会互相打架。淡入淡出改由 audio 自身的音量渐变实现，见 app.js。 -->
  <script src="mqtt.min.js"></script>
  <script src="app.js"></script>
  <script src="request.js"></script>
</body>
</html>
